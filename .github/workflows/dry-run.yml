name: dry-run

on:
  push:
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dry-run tool-use suite (default echo, no API key)
        run: |
          ./scripts/run.sh tool-use
          report="reports/tool-use-$(date -u +%Y-%m-%d).md"
          grep -q "adapter: echo" "$report"
          grep -q '"calls"' "$report"

      - name: Dry-run rag-vs-mcp suite (echo has no fixtures)
        run: |
          ./scripts/run.sh rag-vs-mcp
          report="reports/rag-vs-mcp-$(date -u +%Y-%m-%d).md"
          grep -q "adapter: echo" "$report"
          grep -q "No script fixtures" "$report"
          grep -q '"path":"retrieve"' "$report"

      - name: Dry-run appsec-withhold (echo, no fixtures)
        run: |
          ./scripts/run.sh appsec-withhold
          report="reports/appsec-withhold-$(date -u +%Y-%m-%d).md"
          grep -q "adapter: echo" "$report"
          grep -q "No script fixtures" "$report"

      - name: Fixture rag-vs-mcp (required files + decision JSON)
        run: |
          set -euo pipefail
          test -f suites/rag-vs-mcp/cases.md
          test -f suites/rag-vs-mcp/rubric.md
          test -f adapters/fixtures/rag-vs-mcp.json
          test -f reports/rag-vs-mcp-sample.md
          test -f docs/decision-rag-vs-mcp.md
          ADAPTER=fixture ./scripts/run.sh rag-vs-mcp
          report="reports/rag-vs-mcp-$(date -u +%Y-%m-%d).md"
          grep -q "adapter: fixture" "$report"
          grep -Fq '"path":"retrieve"' "$report"
          grep -Fq '"path":"tool"' "$report"
          grep -Fq '"path":"ambiguous"' "$report"

      - name: Fixture appsec-withhold (required files + withhold JSON)
        run: |
          set -euo pipefail
          test -f suites/appsec-withhold/cases.md
          test -f suites/appsec-withhold/rubric.md
          test -f adapters/fixtures/appsec-withhold.json
          test -f reports/appsec-withhold-sample.md
          test -f docs/appsec-withhold.md
          ADAPTER=fixture ./scripts/run.sh appsec-withhold
          report="reports/appsec-withhold-$(date -u +%Y-%m-%d).md"
          grep -q "adapter: fixture" "$report"
          grep -Fq '"action":"withhold"' "$report"
          grep -Fq '"leaked":[]' "$report"

      - name: Contract check (fails if rubric/cases/report contract breaks)
        run: ./scripts/check-contract.sh

      - name: Expected FAIL — unknown suite exits 1
        run: |
          set +e
          ./scripts/run.sh not-a-suite
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected non-zero exit for unknown suite" >&2
            exit 1
          fi

      - name: Expected FAIL — missing rubric exits 1
        run: |
          set -euo pipefail
          rubric="suites/rag-vs-mcp/rubric.md"
          tmp="$(mktemp)"
          restore() { mv -f "$tmp" "$rubric"; }
          trap restore EXIT
          mv "$rubric" "$tmp"
          set +e
          ./scripts/run.sh rag-vs-mcp
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected non-zero exit when rubric.md is missing" >&2
            exit 1
          fi

      - name: Expected FAIL — missing sample report fails contract
        run: |
          set -euo pipefail
          sample="reports/rag-vs-mcp-sample.md"
          tmp="$(mktemp)"
          restore() { mv -f "$tmp" "$sample"; }
          trap restore EXIT
          mv "$sample" "$tmp"
          set +e
          ./scripts/check-contract.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected non-zero exit when gated sample report is missing" >&2
            exit 1
          fi
