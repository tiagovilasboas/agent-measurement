name: dry-run

on:
  push:
  pull_request:

jobs:
  tool-use:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run tool-use suite
        run: ./scripts/run.sh tool-use
      - name: Unknown suite exits 1
        run: |
          set +e
          ./scripts/run.sh not-a-suite
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected non-zero exit for unknown suite" >&2
            exit 1
          fi
